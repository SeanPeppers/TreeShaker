[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "treeshaker"
version = "0.1.0"
description = "Automated feature selection using XGBoost, SHAP, and Optuna"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
keywords = ["feature-selection", "xgboost", "shap", "optuna", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "xgboost>=2.0.0",
    "shap>=0.42.0",
    "optuna>=3.0.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
treeshaker = "treeshaker.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/treeshaker"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I"]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=treeshaker --cov-report=term-missing"
