[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "treeshaker"
version = "0.1.1"
description = "Automated feature selection using XGBoost, SHAP, and Optuna"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
keywords = ["feature-selection", "xgboost", "shap", "optuna", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [

    "shap>=0.52.0,<1.0.0",
    "xgboost>=3.4.0,<4",
    "optuna>=4.9.0,<5",
    "pandas>=2.0.0,<3.0.0",
    "scikit-learn>=1.9.0,<2",
    "numpy>=1.24.0",
    "matplotlib>=3.11.0,<4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15.20,<1.0.0",
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1.0,<8",
    "mypy>=1.8.0,<3",
]
demo = [
    "gradio>=6.24.0,<7",
]
mcp = [
    "mcp>=2.0.0,<3",
    "lxml>=6.1.1,<7",
]
fast = [
    "treeshaker_lsh>=0.1.0",
]
boruta = []
lightgbm = [
    "lightgbm>=4.7.0,<5",
]
catboost = [
    "catboost>=1.2.0,<2",
]
mlflow = [
    "mlflow>=3.14.0,<4",
]
docs = [

    "sphinx>=7.0.0,<10",
    "furo>=2025.12.19",
    "myst-parser>=1.0.0,<6",
]

[project.scripts]
treeshaker = "treeshaker.cli:main"
treeshaker-mcp = "treeshaker.mcp_server:main"
treeshaker-text = "treeshaker.cli_text:main"

[tool.hatch.build.targets.wheel]
packages = ["src/treeshaker"]

[tool.uv]
# shap's optional numba/llvmlite dependency has no numpy upper bound on its
# oldest release, which lets the resolver pick numpy>=2.5 alongside an
# ancient numba (0.53.1, 2021) that lacks Python 3.13 wheels. Cap numpy so
# the resolver stays on modern, wheel-available numba/llvmlite releases.
constraint-dependencies = ["numpy<2.5"]

[tool.uv.sources]
treeshaker_lsh = { path = "rust/treeshaker_lsh" }

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S"]
# Test asserts and fixture data aren't a security concern.
per-file-ignores = { "tests/**" = ["S101", "S105", "S106"] }


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=treeshaker --cov-report=term-missing --cov-fail-under=85"

[tool.mypy]
python_version = "3.13"
files = ["src/treeshaker"]
# numpy/pandas/xgboost stubs often type return values as Any (e.g. ndarray
# element access, DataFrame column ops), so warn_return_any would mostly
# flag library-boundary noise rather than real bugs in our code.
warn_return_any = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true

# Third-party ML libraries either ship no stubs or only partial stubs.
# Silence missing-import noise from them individually as a backstop in
# case ignore_missing_imports behavior changes; keeps the source code
# free of per-line `# type: ignore[import]` comments.
[[tool.mypy.overrides]]
module = [
    "xgboost.*",
    "shap.*",
    "optuna.*",
    "sklearn.*",
]
ignore_missing_imports = true
