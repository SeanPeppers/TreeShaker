[package]
name = "treeshaker_lsh"
version = "0.1.0"
edition = "2021"
description = "SimHash-based locality-sensitive hashing for near-linear near-duplicate/correlation screening over wide feature sets, used as an opt-in fast path for TreeShaker's leakage detection."
license = "MIT"

[lib]
name = "treeshaker_lsh"
crate-type = ["cdylib"]

[dependencies]
# `extension-module` is intentionally not enabled here: it skips linking
# libpython, which is right for the `.so` maturin builds (Python resolves
# those symbols at dlopen time) but breaks `cargo test`, a standalone
# binary that needs them resolved at link time. maturin enables it via
# `--features pyo3/extension-module` (see pyproject.toml's
# [tool.maturin] `features`), so release builds are unaffected.
pyo3 = { version = "0.30" }
numpy = "0.29"
rand = "0.10"
rand_chacha = "0.10"
rand_distr = "0.6"

[dev-dependencies]
pyo3 = { version = "0.30", features = ["auto-initialize"] }

[profile.release]
lto = true
