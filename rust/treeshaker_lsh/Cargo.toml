[package]
name = "treeshaker_lsh"
version = "0.1.0"
edition = "2021"
description = "SimHash-based locality-sensitive hashing for near-linear near-duplicate/correlation screening over wide feature sets, used as an opt-in fast path for TreeShaker's leakage detection."
license = "MIT"

[lib]
name = "treeshaker_lsh"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
numpy = "0.22"
rand = "0.10"
rand_chacha = "0.3"
rand_distr = "0.4"

[profile.release]
lto = true
