name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies (pinned via uv.lock)
        run: uv sync --locked --extra dev --extra demo --extra mcp

      - name: Check with ruff
        run: uv run ruff check src/ tests/ demo/

      - name: Format check with ruff
        run: uv run ruff format --check src/ tests/ demo/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install package with dev dependencies
        run: pip install -e ".[dev,demo,mcp]"

      - name: Run pytest
        run: pytest

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install mypy
        run: pip install mypy pandas-stubs

      - name: Type check with mypy
        run: mypy src/

  doc-sync:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check README/MCP docs updated alongside API changes
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ "$PR_TITLE" == *"[skip-doc-check]"* ]]; then
            echo "Skipping doc-sync check (opted out via PR title)."
            exit 0
          fi
          changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          api_changed=$(echo "$changed" | grep -E '^src/treeshaker/(config|pipeline|cli)\.py$' || true)
          docs_changed=$(echo "$changed" | grep -E '^(README\.md|src/treeshaker/mcp_server\.py)$' || true)
          if [[ -n "$api_changed" && -z "$docs_changed" ]]; then
            echo "Changed files that can affect the public API/CLI:"
            echo "$api_changed"
            echo
            echo "README.md and src/treeshaker/mcp_server.py were not updated."
            echo "Per CLAUDE.md, Config/pipeline public methods/CLI flags must stay in sync with the README and MCP tool schema in the same PR."
            echo "If this change doesn't affect the public surface, add [skip-doc-check] to the PR title."
            exit 1
          fi

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Upgrade pip
        run: pip install --upgrade pip

      - name: Install project
        run: pip install -e .

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: pip-audit
